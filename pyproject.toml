[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "httpcassette"
dynamic = ["version"]
description = "Record, replay and stub any HTTP service from cassettes: one JSON file per call; list, show and diff sets."
readme = "README.md"
requires-python = ">=3.9"
# requests: only the proxy's record and auto modes forward to an upstream; replay, stub and the store need none.
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
socks = ["requests[socks]>=2.28"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.dynamic]
version = { attr = "httpcassette.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["httpcassette"]
